name: Update Daily Meme

on:
  schedule:
    # Every day at 12:00 HFX time
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-meme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch random meme
        id: meme
        env:
          HUMOR_API_KEY: ${{ secrets.HUMOR_API_KEY }}
        run: |
          set -e

          response=$(curl -fsSL \
            -H "x-api-key: ${HUMOR_API_KEY}" \
            "https://api.humorapi.com/memes/random?media-type=image&min-rating=6")

          meme_url=$(echo "$response" | jq -r '.url')

          if [ -z "$meme_url" ] || [ "$meme_url" = "null" ]; then
            echo "Failed to retrieve meme."
            echo "$response"
            exit 1
          fi

          echo "Meme URL: $meme_url"

          echo "url=$meme_url" >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          MEME_URL: ${{ steps.meme.outputs.url }}
        run: |
          python3 <<'PY'
          import os
          import re

          readme_path = "README.md"
          meme_url = os.environ["MEME_URL"]

          with open(readme_path, "r", encoding="utf-8") as f:
              content = f.read()

          replacement = f"""<!-- MEME_START -->

          ![Daily Meme]({meme_url})

          *Powered by Humor API*

          <!-- MEME_END -->"""

          pattern = re.compile(
              r"<!-- MEME_START -->.*?<!-- MEME_END -->",
              re.DOTALL
          )

          updated_content, count = pattern.subn(
              replacement,
              content,
              count=1
          )

          if count != 1:
              raise RuntimeError(
                  "MEME_START / MEME_END markers not found exactly once."
              )

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(updated_content)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update daily meme"
          git push
