name: Update Daily Meme

on:
  schedule:
    # Every day at 00:00 HFX time
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-meme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch random meme
        id: meme
        env:
          HUMOR_API_KEY: ${{ secrets.HUMOR_API_KEY }}
        run: |
          set -e

          mkdir -p assets

          response=$(curl -fsSL \
            -H "x-api-key: ${HUMOR_API_KEY}" \
            "https://api.humorapi.com/memes/search?number=1&keywords=tech")

            meme_url=$(echo "$response" | jq -r '.memes[0].url')
          if [ -z "$meme_url" ] || [ "$meme_url" = "null" ]; then
            echo "Failed to retrieve meme."
            echo "$response"
            exit 1
          fi

          echo "Downloading meme from:"
          echo "$meme_url"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$meme_url" \
            -o assets/daily-meme.jpg

          file assets/daily-meme.jpg
          
      - name: Update README
        run: |
          python3 <<'PY'
          import re

          readme_path = "README.md"

          with open(readme_path, "r", encoding="utf-8") as f:
              content = f.read()

          replacement = """<!-- MEME_START -->

          ![Daily Meme](./assets/daily-meme.jpg)

          *Powered by Humor API*

          <!-- MEME_END -->"""

          pattern = re.compile(
              r"<!-- MEME_START -->.*?<!-- MEME_END -->",
              re.DOTALL
          )

          updated_content, count = pattern.subn(
              replacement,
              content,
              count=1
          )

          if count != 1:
              raise RuntimeError(
                  "MEME_START / MEME_END markers not found exactly once."
              )

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(updated_content)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/daily-meme.jpg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update daily meme"
          git push
