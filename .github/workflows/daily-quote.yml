name: Update Daily Quote

on:
  schedule:
    # Runs every day at 12:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch random joke
        id: joke
        env:
          HUMOR_API_KEY: ${{ secrets.HUMOR_API_KEY }}
        run: |
          set -e

          response=$(curl -fsSL \
            -H "x-api-key: ${HUMOR_API_KEY}" \
            "https://api.humorapi.com/jokes/random")

          joke=$(echo "$response" | jq -r '.joke')

          if [ -z "$joke" ] || [ "$joke" = "null" ]; then
            echo "Failed to retrieve joke"
            exit 1
          fi

          {
            echo "joke<<EOF"
            echo "$joke"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          JOKE: ${{ steps.joke.outputs.joke }}
        run: |
          python3 <<'PY'
          import os
          import re

          readme_path = "README.md"

          with open(readme_path, "r", encoding="utf-8") as f:
              content = f.read()

          joke = os.environ["JOKE"].strip()

          # Escape Markdown-sensitive characters
          joke = joke.replace("\r\n", "\n").replace("\r", "\n")

          # Format multiline jokes as a Markdown blockquote
          formatted_joke = "\n".join(
              f"> *{line}*" if line.strip() else ">"
              for line in joke.split("\n")
          )

          replacement = (
              "<!-- QUOTE_START -->\n\n"
              f"{formatted_joke}\n\n"
              "— Humor API\n\n"
              "<!-- QUOTE_END -->"
          )

          pattern = re.compile(
              r"<!-- QUOTE_START -->.*?<!-- QUOTE_END -->",
              re.DOTALL
          )

          updated_content, count = pattern.subn(
              replacement,
              content,
              count=1
          )

          if count != 1:
              raise RuntimeError(
                  "QUOTE_START / QUOTE_END markers not found exactly once."
              )

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(updated_content)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update daily quote"
          git push
